name: Daily market brief email

on:
  # Precise trigger: an external cron service (e.g. cron-job.org) POSTs a
  # repository_dispatch at the exact desired time. GitHub's own schedule below
  # is a best-effort fallback (GitHub cron can be delayed or skipped).
  repository_dispatch:
    types: [daily-brief]
  schedule:
    # 23:30 UTC = 06:30 Asia/Bangkok (ICT), Monday–Friday — earlier, as a
    # fallback so even with GitHub's delay it tends to land before the morning.
    - cron: "30 23 * * 0-4"
  workflow_dispatch:
    inputs:
      dry_run:
        description: "Build the image only, do not send the email"
        type: boolean
        default: false

jobs:
  send-brief:
    runs-on: ubuntu-latest
    # Needed by the keepalive step below, which pushes a timestamp commit.
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: pip install -r scripts/requirements.txt

      - name: Install Chromium for rendering
        run: python -m playwright install --with-deps chromium

      - name: Build and send MARKET BRIEF
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          GMAIL_USER: ${{ secrets.GMAIL_USER }}
          GMAIL_APP_PASSWORD: ${{ secrets.GMAIL_APP_PASSWORD }}
          MAIL_TO: ${{ secrets.MAIL_TO }}
        run: |
          if [ "${{ github.event.inputs.dry_run }}" = "true" ]; then
            python scripts/market_brief.py --dry-run
          else
            python scripts/market_brief.py
          fi

      - name: Upload brief image (for dry-run inspection)
        if: ${{ github.event.inputs.dry_run == 'true' }}
        uses: actions/upload-artifact@v4
        with:
          name: market-brief
          path: scripts/market_brief.png

      # GitHub automatically disables a scheduled workflow after 60 days with
      # no repository activity. That is exactly what happened here: the last
      # commit was 2026-07-31, the workflow was disabled (disabled_inactivity)
      # around 2026-09-30, and the brief silently stopped arriving on
      # 2026-10-01 — nothing in the code had broken.
      #
      # To stop that recurring, push a dated timestamp whenever the repository
      # has been quiet for 20+ days. That resets the inactivity clock long
      # before it reaches 60, and costs about 18 tiny commits a year.
      #
      # A push made with GITHUB_TOKEN does not trigger workflow runs, so this
      # cannot loop. It is also best-effort: a failure here must never be
      # reported as a failure to send the brief.
      - name: Keep the schedule alive
        if: ${{ always() && github.event.inputs.dry_run != 'true' }}
        continue-on-error: true
        run: |
          set -u
          quiet_days=$(( ( $(date +%s) - $(git log -1 --format=%ct) ) / 86400 ))
          echo "Repository has been quiet for ${quiet_days} day(s)."
          if [ "$quiet_days" -lt 20 ]; then
            echo "Under the 20-day threshold — nothing to do."
            exit 0
          fi
          date -u +"%Y-%m-%dT%H:%M:%SZ" > .github/keepalive
          git config user.name  "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add .github/keepalive
          git commit -m "chore: keep the scheduled market brief alive"
          git push origin "HEAD:${GITHUB_REF_NAME}"
